<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Adventure</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Text Adventure</h1>
    <p id="game-field">
      You are in a dark forest. You see light coming out of a cave.
      <br />
      Because it's so cold, you put your hands in your pockets.
      <br />
      You find a flash light.
      <br />
      Options: [cave, flashlight]
    </p>
    <div class="input-area">
      <input type="text" id="input-field" />
      <button onclick="gameLoop()">Type</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
